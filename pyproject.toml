[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stagezero"
version = "0.1.0"
description = "Customer-discovery agent for pre-PMF founders (neatHack #1)"
requires-python = ">=3.10"
dependencies = [
    "neatlogs>=0.2",
    "openai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stagezero = "stagezero.cli:main"

[tool.setuptools.packages.find]
include = ["stagezero*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
